service: sandwich
image: ghcr.io/sausage-sandwich/sandwich

servers:
  web:
    hosts:
      - hamsandwich.club
    options:
      # Postgres runs directly on the droplet's host OS, outside of Docker.
      # The app container's own localhost/127.0.0.1 is a separate network
      # namespace and can never reach it, so give the container a DNS name
      # that resolves to the host machine instead.
      add-host: "host.docker.internal:host-gateway"

proxy:
  ssl: true
  host: hamsandwich.club
  app_port: 3000

registry:
  server: ghcr.io
  username: sausage-sandwich
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "true"
    RAILS_SERVE_STATIC_FILES: "true"

ssh:
  user: sandwich

builder:
  arch: amd64
  secrets:
    - RAILS_MASTER_KEY
